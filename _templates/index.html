<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{description}}" />
    <title>{{title}}</title>
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/favicons/favicon-96x96.png"
      sizes="96x96" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="記録変換" />
    <link rel="manifest" href="/assets/images/favicons/site.webmanifest" />
    <!-- Font -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanjp.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- JavaScript -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <main>
        <h1 class="title">{{title}}</h1>
        <noscript>
          <div>
            <p class="h2">【JavaScriptが無効になっています】</p>
            <p>このページはJavaScriptを使用しています。</p>
            <p>ブラウザーの設定で、JavaScriptを有効化してください。</p>
          </div>
        </noscript>
        <div class="main" id="main" style="display: none">{{main}}</div>
      </main>
    </div>
    <script>
      document.getElementById('main').removeAttribute('style');
    </script>
  </body>
</html>
