<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="入力された距離と記録から、別の距離に換算した予想タイムや時速などを計算します。"
    />
    <title>記録変換ツール</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <main>
        <h1>記録変換ツール</h1>
        <p>
          入力された距離と記録から、別の距離に換算した予想タイムや時速などを計算します。
        </p>
        <div class="main">
          <div class="input">
            <p class="header">記録</p>
            <div class="length">
              <span>
                <input min="0" type="number" id="beforeLen" />
                <label for="beforeLen">m</label>
              </span>
            </div>
            <div class="time">
              <span>
                <input min="0" max="59" type="number" id="minutes" /><label
                  for="minutes"
                  >分</label
                >
              </span>
              <span>
                <input min="0" max="59" type="number" id="seconds" /><label
                  for="seconds"
                  >秒</label
                >
              </span>
            </div>
            <p class="header">変換後の距離</p>
            <span
              ><input min="0" type="number" id="afterLen" /><label
                for="afterLen"
                >m</label
              ></span
            >
          </div>
          <div class="output">
            <p class="header">変換した記録</p>
            <noscript>
              <p>このツールはJavaScriptを使用しています。</p>
              <p>ブラウザーの設定で、JavaScriptを有効化してください。</p>
            </noscript>
            <p id="output">変換後のタイム:</p>
            <p id="hm">時速:</p>
            <p id="mm">分速:</p>
            <p id="sm">秒速:</p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
