<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="入力された開始時間と終了時間から、現在どれだけ経過したかを計算します。" />
    <meta name="theme-color" content="#028760" />
    <meta name="robots" content="index, follow" />
    <title>経過率計算</title>
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/favicon/favicon-96x96.png"
      sizes="96x96" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicon/apple-touch-icon.png" />
    <!-- Font -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanjp.css"
      as="style" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanjp.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/tools/assets/css/tools.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- JavaScript -->
    <script src="/assets/js/script.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <main>
        <h1 class="title">経過率計算</h1>
        <p>
          入力された開始時間と終了時間から、現在どれだけ経過したかを計算します。
        </p>
        <ul>
          <li>1年は365日、1カ月は31日として計算されます。</li>
          <li>開始日時よりも終了日時の方が後である必要があります。</li>
          <li>日付の入力は必須です。</li>
          <li>時間は未入力の場合、午前0時として扱われます。</li>
        </ul>
        <noscript>
          <div>
            <h2>【JavaScriptが無効になっています】</h2>
            <p>このページはJavaScriptを使用しています。</p>
            <p>ブラウザーの設定で、JavaScriptを有効化してください。</p>
          </div>
        </noscript>
        <div class="main" id="js-enabled" hidden>
          <div class="input">
            <fieldset class="tdinput">
              <legend class="h3">開始日時</legend>
              <input type="date" id="sDate" />
              <input type="time" step="1" id="sTime" />
            </fieldset>
            <fieldset class="tdinput">
              <legend class="h3">終了日時</legend>
              <input type="date" id="fDate" />
              <input type="time" step="1" id="fTime" />
            </fieldset>
          </div>
          <div class="output">
            <h3>計算結果</h3>
            <p>
              <span class="label">経過率</span> :
              <br class="outputBr" />
              <span id="percent" class="outputSpan"></span>
            </p>
            <p>
              <span class="label">長さ</span> :
              <br class="outputBr" />
              <span id="howLong" class="outputSpan"></span>
            </p>
            <p>
              <span class="label">経過時間</span> :
              <br class="outputBr" />
              <span id="elapsedTime" class="outputSpan"></span>
            </p>
            <p>
              <span class="label">残り時間</span> :
              <br class="outputBr" />
              <span id="remainingTime" class="outputSpan"></span>
            </p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
