<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="入力された距離と記録から、別の距離に換算した予想タイムや時速などを計算します。" />
    <meta name="theme-color" content="#028760" />
    <meta name="robots" content="noindex, nofollow" />
    <meta author="mikann-260" />
    <title>記録変換</title>
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/favicon/favicon-96x96.png"
      sizes="96x96" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="記録変換" />
    <link rel="manifest" href="record-converter.webmanifest" />
    <!-- Font -->
    <link
      href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanjp.css"
      rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      crossorigin="anonymous"
      rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/tools/assets/css/tools.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- JavaScript -->
    <script src="/assets/js/script.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <main>
        <h1 class="title">記録変換</h1>
        <p>
          入力された距離と記録から、別の距離に換算した予想タイムや時速などを計算します。
        </p>
        <noscript>
          <div>
            <h2>【JavaScriptが無効になっています】</h2>
            <p>このページはJavaScriptを使用しています。</p>
            <p>ブラウザーの設定で、JavaScriptを有効化してください。</p>
          </div>
        </noscript>
        <div class="main" id="js-enabled" hidden>
          <div class="input">
            <fieldset>
              <legend class="h3">記録</legend>
              <div class="length">
                <label>
                  <input min="0" step="1" type="number" id="beforeLen" />
                  m
                </label>
              </div>
              <div class="time">
                <label>
                  <input min="0" step="1" type="number" id="minutes" />
                  分
                </label>
                <label>
                  <input min="0" max="59" type="number" id="seconds" />
                  秒
                </label>
              </div>
            </fieldset>
            <fieldset>
              <legend class="h3">変換後の距離</legend>
              <label>
                <input min="0" step="1" type="number" id="afterLen" />
                m
              </label>
            </fieldset>
          </div>
          <div class="output">
            <h3>計算結果</h3>
            <p ><span class="label">タイム</span> : <span id="output"></span></p>
            <p ><span class="label">時速</span> : <span id="hm"></span></p>
            <p ><span class="label">分速</span> : <span id="mm"></span></p>
            <p ><span class="label">秒速</span> : <span id="sm"></span></p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
